// Root build file.
// Plugins are resolved through pluginManagement in settings.gradle.
// Library versions are set directly in app/build.gradle.
plugins {
    id 'com.android.application' version '9.4.1' apply false
    id 'com.android.library' version '9.4.1' apply false
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

tasks.register('clean', Delete) {
    delete rootProject.layout.buildDirectory
}